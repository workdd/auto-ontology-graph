[project]
name = "auto-ontology-graph"
version = "0.1.0"
description = "A derived property graph of an Auto-Ontology semantic layer in Apache AGE, with a store interface for joining non-relational sources."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# mcp 2.x removed mcp.server.fastmcp; keep below it until the server is ported.
mcp = ["mcp>=1.9,<2"]

[project.scripts]
aog = "auto_ontology_graph.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_ontology_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
